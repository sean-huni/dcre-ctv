# 12FactorApp: committed working dev defaults; env overrides. (yml-only rule, configuration.md p19)
spring:
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DCRE_DB_URL:jdbc:postgresql://localhost:26257/dcre_col?sslmode=disable}
    username: ${DCRE_DB_USER:root}
    password: ${DCRE_DB_PASSWORD:}
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
    # Shared DB, per-service migration history (same isolation idea as CTV_BATCH_)
    database-change-log-table: ctv_databasechangelog
    database-change-log-lock-table: ctv_databasechangeloglock

dcre:
  exchange-root: ${DCRE_EXCHANGE_ROOT:../../../../../infra/dcre-infra/exchange}
  amount-scale: ${DCRE_AMOUNT_SCALE:2}
  v1-enabled: ${DCRE_V1_ENABLED:false}
  flow-dc: ${DCRE_FLOW_DC:true}
  batch:
    table-prefix: CTV_BATCH_
  agtops-db-url: ${DCRE_AGTOPS_DB_URL:jdbc:postgresql://localhost:26257/agt_ops?sslmode=disable}
  agtops-db-user: ${DCRE_AGTOPS_DB_USER:root}
  agtops-db-password: ${DCRE_AGTOPS_DB_PASSWORD:}
  ctv:
    max-partitions: ${DCRE_CTV_MAX_PARTITIONS:5}
    # M10 T15 (SCRUM-78): DC-flow mandate gate source. legacy = dcre_col mandate
    # table (current, default, kept until M11 retirement); projection = MSR-owned
    # dcre_man man_ctv_view (state must be exactly ACCP). The T16 gate env flips
    # this to projection once the toolkit has seeded dcre_man.
    mandate-source: ${DCRE_CTV_MANDATE_SOURCE:legacy}
    # Second, READ-ONLY connection to the dcre_man projection (R-10). Opened
    # lazily and only in projection mode; dev clean-clone defaults (12FactorApp),
    # every deployed context overrides via env. NOT the primary spring.datasource.*
    # creds, so the standing-cluster ctv role holds only SELECT on man_ctv_view.
    mandates-db-url: ${DCRE_CTV_MANDATES_DB_URL:jdbc:postgresql://localhost:26257/dcre_man?sslmode=disable}
    mandates-db-user: ${DCRE_CTV_MANDATES_DB_USER:root}
    mandates-db-password: ${DCRE_CTV_MANDATES_DB_PASSWORD:}
    acceptance-mode:
      default: ${DCRE_CTV_ACCEPTANCE_MODE_DEFAULT:ALL_OR_NOTHING}
      # Per-client override map. No DCRE_* env var is wired for the map: set
      # per-client mode via a yaml override. Client tokens are UPPERCASE, so the
      # key MUST be bracketed to survive relaxed binding, e.g. as yaml
      #   clients:
      #     "[FNBRF01]": PARTIAL
      # or as a property  dcre.ctv.acceptance-mode.clients.[FNBRF01]=PARTIAL
      # SCRUM-42: FNBCC02 PARTIAL is a committed working default so in-cluster
      # partial-failure scenarios run WITHOUT env passthrough (AGT cannot pass
      # extra env to stage pods yet, blocker seen 2026-07-13).
      clients:
        "[FNBCC02]": PARTIAL

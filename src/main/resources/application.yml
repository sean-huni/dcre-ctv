# 12FactorApp: committed working dev defaults; env overrides. (yml-only rule, configuration.md p19)
spring:
  threads:
    virtual:
      enabled: true
  batch:
    job:
      # SCRUM-107: CTV carries TWO jobs now, ctvJob (the validation flow) and
      # accountReferenceLoadJob (the reference-artifact loader). Boot's
      # JobLauncherApplicationRunner runs EVERY Job bean in the context unless this
      # property names one, so leaving it unset would have started running the loader on
      # every arrival the moment the second bean appeared. This is Boot's own selection
      # mechanism, not a bespoke one. The default keeps the validation flow as the default
      # job, so every existing caller (AGT passes no job name) is unchanged; a loader run
      # is DCRE_CTV_JOB_NAME=accountReferenceLoadJob. Pinned by CtvJobSelectionTest.
      name: ${DCRE_CTV_JOB_NAME:ctvJob}
  datasource:
    url: ${DCRE_DB_URL:jdbc:postgresql://localhost:26257/dcre_col?sslmode=disable}
    username: ${DCRE_DB_USER:root}
    password: ${DCRE_DB_PASSWORD:}
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
    # Shared DB, per-service migration history (same isolation idea as CTV_BATCH_)
    database-change-log-table: ctv_databasechangelog
    database-change-log-lock-table: ctv_databasechangeloglock

dcre:
  exchange-root: ${DCRE_EXCHANGE_ROOT:../../../../../../infra/dcre-infra/exchange}
  amount-scale: ${DCRE_AMOUNT_SCALE:2}
  v1-enabled: ${DCRE_V1_ENABLED:false}
  flow-dc: ${DCRE_FLOW_DC:true}
  batch:
    table-prefix: CTV_BATCH_
  agtops-db-url: ${DCRE_AGTOPS_DB_URL:jdbc:postgresql://localhost:26257/agt_ops?sslmode=disable}
  agtops-db-user: ${DCRE_AGTOPS_DB_USER:root}
  agtops-db-password: ${DCRE_AGTOPS_DB_PASSWORD:}
  ctv:
    max-partitions: ${DCRE_CTV_MAX_PARTITIONS:5}
    # SCRUM-107: DC-flow mandate gate source. The projection is the AUTHORITY and
    # the default: dcre_man man_ctv_view, the contract the mandates family owns and
    # maintains (state must be exactly ACCP). The former `legacy` value read
    # dcre_col.mandate, a mandates table that lived in the collections database and
    # that no service owned; it was dropped in 2026/08/001-drop-local-mandate.xml.
    mandate-source: ${DCRE_CTV_MANDATE_SOURCE:projection}
    # Second, READ-ONLY connection to the dcre_man projection (R-10). Opened
    # lazily and only in projection mode; dev clean-clone defaults (12FactorApp).
    # NOT the primary spring.datasource.* creds, so the standing-cluster ctv role
    # holds only SELECT on man_ctv_view.
    # The localhost default is the clean-clone dev target ONLY: MandatesDatasourceConfig
    # makes it fatal at startup inside a pod, because nothing injected
    # DCRE_CTV_MANDATES_DB_URL and every in-cluster projection gate aimed at localhost
    # (2026-07-26). AGT now sets it on every CTV stage pod.
    # Keep this literal in step with MandatesDatasourceConfig.LOCAL_DEV_URL (parity-tested).
    mandates-db-url: ${DCRE_CTV_MANDATES_DB_URL:jdbc:postgresql://localhost:26257/dcre_man?sslmode=disable}
    mandates-db-user: ${DCRE_CTV_MANDATES_DB_USER:root}
    mandates-db-password: ${DCRE_CTV_MANDATES_DB_PASSWORD:}
    # SCRUM-107: the versioned account reference artifact. ACS, the shared dcre_acs
    # reference database, is retired: it had no authoritative source, no accountable
    # owner, no ingestion of its own and no freshness contract, which made it a shared
    # integration database wearing the costume of a bounded context. The rows now travel
    # as ONE immutable versioned artifact and CTV materialises its OWN projection into
    # dcre_col.account, with its OWN NOT NULL constraints. No shared store, no
    # cross-context read.
    reference:
      account:
        # DERIVED FROM THE EXCHANGE ROOT, and that is the whole point: DCRE_EXCHANGE_ROOT
        # is already injected into every stage pod as /exchange, backed by the
        # dcre-exchange PVC, which is the ONLY volume a stage pod has. So in a pod this
        # resolves to /exchange/reference/account with NO new AGT env injection at all,
        # and on a dev machine with no .env it resolves to
        # infra/dcre-infra/exchange/reference/account (12FactorApp Alignment -
        # https://12factor.net/). The previous default pointed six ../ hops at
        # infra/dcre-infra/fixtures/reference/account, a path that resolves only on a
        # developer's machine and cannot exist in a pod, so the loader could never have
        # found the artifact in a deployed environment.
        #
        # fixtures/reference/account stays the committed SOURCE of the artifact in git.
        # infra/dcre-infra/scripts/materialise-account-reference.sh VALIDATES it and
        # stages a copy into the exchange root at deploy time; this service reads the
        # STAGED copy and never the git fixtures path.
        root: ${DCRE_CTV_ACCOUNT_REFERENCE_ROOT:${DCRE_EXCHANGE_ROOT:../../../../../../infra/dcre-infra/exchange}/reference/account}
        # The consumer DECLARES the version it wants. There is no "newest directory"
        # behaviour: that is a fail-open, because a directory appearing beside this one
        # would silently change what every verdict is judged against. A manifest
        # declaring anything else FAILS the load.
        dataset-version: ${DCRE_CTV_ACCOUNT_DATASET_VERSION:2026.08.09-001}
        # max-age: DELIBERATELY UNSET, and it stays unset until A-4 lands. The check is
        # wired and INERT: while this is absent the loader logs at INFO on every run that
        # freshness is not enforced, and proceeds. Setting it here arms the gate with no
        # code change. Do NOT invent a number, in code, in this file, or as a test
        # resource default: an unowned production rule wearing the costume of a decision
        # is worse than an admitted gap.
    acceptance-mode:
      default: ${DCRE_CTV_ACCEPTANCE_MODE_DEFAULT:ALL_OR_NOTHING}
      # Per-client override map. No DCRE_* env var is wired for the map: set
      # per-client mode via a yaml override. Client tokens are UPPERCASE, so the
      # key MUST be bracketed to survive relaxed binding, e.g. as yaml
      #   clients:
      #     "[FNBRF01]": PARTIAL
      # or as a property  dcre.ctv.acceptance-mode.clients.[FNBRF01]=PARTIAL
      # SCRUM-42: FNBCC02 PARTIAL is a committed working default so in-cluster
      # partial-failure scenarios run WITHOUT env passthrough (AGT cannot pass
      # extra env to stage pods yet, blocker seen 2026-07-13).
      clients:
        "[FNBCC02]": PARTIAL
